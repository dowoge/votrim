[package]
name = "votrim"
version = "0.3.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
libc = "0.2.189"
libmpv2 = "6"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
